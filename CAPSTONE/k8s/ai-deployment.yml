apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-deployment
  labels:
    name: ai-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai
  template:
    metadata:
      labels:
        app: ai
    spec:
      containers:
      - image: ai-orchestration:latest
        name: ai-server
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            cpu: "500m"
            memory: "500M"
          requests:
            cpu: "250m"
            memory: "250M"
        livenessProbe:
          httpGet:
            path: /api/status/healthz
            port: 3000
          initialDelaySeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/status/healthz
            port: 3000
          initialDelaySeconds: 15
          timeoutSeconds: 10
        ports:
        - containerPort: 3000
          name: ai-port
