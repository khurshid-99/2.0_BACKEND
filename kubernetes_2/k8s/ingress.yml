apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: express-app
  labels:
    app.kubernetes.io/name: express-app
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: main-service
            port: 
              number: 80
  - http:
      paths:
      - pathType: Prefix
        path: "/api/product"
        backend:
          service:
            name: porduct-services
            port:
              number: 80
